<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python CLI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #111;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000;
          --fg: #eee;
        }
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      textarea,
      #output-screen {
        display: block;
        max-width: 960px;
        width: 100%;
        height: 100%;
        padding: 1rem 1rem 4rem;
        border: 0;
        outline: 0;
        margin: 0 auto;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 1rem;
        line-height: 1.7;
        box-sizing: border-box;
      }

      textarea {
        resize: none;
        tab-size: 4;
      }

      #output-screen {
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      #output-screen[hidden],
      textarea[hidden] {
        display: none;
      }

      button,
      input {
        outline: 0;
        color: inherit;
        font: inherit;
        background-color: var(--bg);
        border-radius: 4px;
        border: 1px solid var(--fg);
      }

      #input-line {
        width: min(100%, 40rem);
        line-height: 1.5;
      }

      #mode-toggle {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        padding: 0.4rem;
      }
    </style>
  </head>
  <body>
    <textarea id="source-screen" spellcheck="false" aria-label="Python source code"></textarea>
    <pre id="output-screen" aria-label="Program output" hidden></pre>
    <button id="mode-toggle">Run</button>

    <script>
      const sourceScreen = document.getElementById('source-screen')
      const outputScreen = document.getElementById('output-screen')
      const modeToggle = document.getElementById('mode-toggle')

      let mode = 'source'
      let worker
      let inputLine
      let hashWrite = 0

      function setMode(nextMode) {
        mode = nextMode
        sourceScreen.hidden = mode !== 'source'
        outputScreen.hidden = mode === 'source'
        modeToggle.textContent = mode === 'source' ? 'Run' : 'View Source'

        if (mode === 'source') sourceScreen.focus()
      }

      function appendOutput(text) {
        outputScreen.append(document.createTextNode(text))
        outputScreen.scrollTop = outputScreen.scrollHeight
      }

      function bytesToBase64(bytes) {
        let binary = ''
        const chunkSize = 0x8000

        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize))
        }

        return btoa(binary)
      }

      function base64ToBytes(value) {
        const binary = atob(value)
        const bytes = new Uint8Array(binary.length)

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i)
        }

        return bytes
      }

      async function encodeSource(text) {
        const input = new Blob([new TextEncoder().encode(text)]).stream()
        const compressed = input.pipeThrough(new CompressionStream('deflate-raw'))
        const bytes = new Uint8Array(await new Response(compressed).arrayBuffer())

        return bytesToBase64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '')
      }

      async function decodeSource(value) {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/')
        const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4)
        const compressed = base64ToBytes(padded)
        const input = new Blob([compressed]).stream()
        const decompressed = input.pipeThrough(new DecompressionStream('deflate-raw'))
        const bytes = await new Response(decompressed).arrayBuffer()

        return new TextDecoder().decode(bytes)
      }

      async function updateHash(text) {
        const version = ++hashWrite
        const encoded = await encodeSource(text)

        if (version === hashWrite) {
          history.replaceState(null, '', location.href.split('#')[0] + '#' + encoded)
        }
      }

      function stopWorker() {
        worker?.terminate()
        worker = undefined
        inputLine?.remove()
        inputLine = undefined
      }

      function makeProgram(text) {
        const adapted = text.replace(/\binput\s*\(/g, '(await input(')
        const body = adapted
          .split('\n')
          .map(line => '    ' + line)
          .join('\n')
          .replace(/\(await input\(([^()\n]*)\)/g, '(await input($1))')

        return [
          'import sys',
          'class _ConsoleOutput:',
          '    def write(self, value):',
          '        _emit(str(value))',
          '        return len(value)',
          '    def flush(self):',
          '        pass',
          'sys.stdout = _ConsoleOutput()',
          'sys.stderr = sys.stdout',
          "async def input(prompt=''):",
          '    _emit(str(prompt))',
          '    return await _read_line()',
          'async def _user_main():',
          body || '    pass',
          'await _user_main()',
        ].join('\n')
      }

      function requestInput() {
        inputLine?.remove()

        inputLine = document.createElement('input')
        inputLine.id = 'input-line'
        inputLine.type = 'text'
        inputLine.autocomplete = 'off'
        inputLine.setAttribute('aria-label', 'Program input')
        outputScreen.append(inputLine)
        inputLine.focus()

        inputLine.addEventListener('keydown', event => {
          if (event.key !== 'Enter' || !worker) return

          event.preventDefault()
          const value = inputLine.value
          inputLine.remove()
          inputLine = undefined

          appendOutput(value + '\n')
          worker.postMessage({ type: 'input-response', text: value })
        })
      }

      function runProgram() {
        updateHash(sourceScreen.value).catch(() => {})
        stopWorker()
        outputScreen.replaceChildren(document.createTextNode('Loading...\n'))
        setMode('run')

        try {
          worker = new Worker('./python-worker.mjs', { type: 'module' })
        } catch (error) {
          appendOutput(String(error) + '\n')
          return
        }

        worker.onmessage = event => {
          if (!worker) return

          const { type, text } = event.data

          if (type === 'ready') {
            outputScreen.replaceChildren()
          } else if (type === 'output') {
            appendOutput(text)
          } else if (type === 'input-request') {
            requestInput()
          } else if (type === 'error') {
            appendOutput(text + '\n')
            stopWorker()
          } else if (type === 'finished') {
            stopWorker()
          }
        }

        worker.onerror = event => {
          appendOutput(event.message + '\n')
          stopWorker()
        }

        worker.postMessage({
          type: 'run',
          text: makeProgram(sourceScreen.value),
        })
      }

      sourceScreen.addEventListener('input', () => {
        if (mode === 'source') updateHash(sourceScreen.value).catch(() => {})
      })

      modeToggle.addEventListener('click', () => {
        if (mode === 'source') {
          runProgram()
        } else {
          stopWorker()
          setMode('source')
        }
      })

      async function start() {
        const fragment = location.hash.slice(1)

        if (!fragment) {
          setMode('source')
          return
        }

        try {
          sourceScreen.value = await decodeSource(fragment)
          runProgram()
        } catch {
          setMode('source')
        }
      }

      start()
    </script>
  </body>
</html>
